<div class="confirm-email">
  <img src="assets/confirmEmail.png" alt="Confirmar email imagen" />

  <h4>Confirme su email</h4>

  <p>
    Please check your inbox, copy the verification code and paste it in the
    field below to confirm your email. <b>Or click, the link in the mail.</b>
  </p>

  <app-input-field
    placeholder="Unique reference code"
    [(ngModel)]="referenceCode"
  ></app-input-field>
</div>
